name: branitz
channels:
  - conda-forge
dependencies:
  - python=3.10
  # Geospatial stack (binary deps — much easier via conda-forge)
  - geopandas>=0.14.0
  - shapely>=2.0.0
  - pyproj>=3.5.0
  # Scientific core
  - pandas>=2.0.0
  - numpy>=1.24.0
  - scipy>=1.10.0
  - scikit-learn>=1.3.0
  - pyarrow
  # Visualization
  - matplotlib>=3.7.0
  - folium>=0.15.0
  - branca>=0.7.0
  - pip
  - pip:
      # Energy simulation
      - pandapipes>=0.8.0
      - pandapower>=2.13.0
      # LLM (optional)
      - google-genai>=0.3.0
      # Misc
      - pyyaml>=6.0
      - tqdm>=4.64.0
      - python-dotenv>=1.0.0
      - jinja2>=3.1.0
      # Web API
      - fastapi>=0.110.0
      - uvicorn[standard]>=0.29.0
      # UI (optional)
      - streamlit>=1.30.0
      # Testing
      - pytest>=7.4.0
